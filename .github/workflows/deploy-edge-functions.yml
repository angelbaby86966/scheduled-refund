name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_ID_PROD: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          # 新版 Supabase CLI 在非交互环境要求显式确认，否则报
          # "Confirmation required ... Re-run with --yes to confirm" 并直接失败（代码永远上不了线）
          if [ -n "$SUPABASE_PROJECT_ID" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --yes
          fi
          if [ -n "$SUPABASE_PROJECT_ID_PROD" ] && [ "$SUPABASE_PROJECT_ID_PROD" != "$SUPABASE_PROJECT_ID" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID_PROD" --yes
          fi
