name: oneoff-delete-chu

on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/oneoff-delete-chu.yml]

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete chu via Supabase Management API
        env:
          SUPA_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          echo "project_ref=$REF"
          SQL='WITH d AS (DELETE FROM public.app_users WHERE username=$$chu$$ RETURNING username) SELECT count(*) AS deleted FROM d;'
          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$SQL")
          echo '--- delete response ---'
          curl -sS --fail-with-body --max-time 30 -X POST \
            "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPA_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" -w '\nHTTP=%{http_code}\n'
          SQL2='SELECT count(*) AS remaining FROM public.app_users WHERE username=$$chu$$;'
          PAYLOAD2=$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$SQL2")
          echo '--- verify response ---'
          curl -sS --fail-with-body --max-time 30 -X POST \
            "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPA_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD2" -w '\nHTTP=%{http_code}\n'
