name: oneoff-ops
# 统一运维入口（ops-deploy 分支专用）
#
# 为什么复用这一个文件：GitHub 对非默认分支上新 workflow 文件的注册不稳定
# （实测同一分支上最小可用文件也不注册），而已注册文件按 ref 覆盖内容后
# dispatch 会正确解析 ref 上的最新内容。因此所有一次性运维都收敛到这个文件。
#
# modes:
#   handoff    - 清理遗留 probe_tmp secret key + 密文交接强凭据（RSA 公钥在下方）
#   deploy-edge- 部署 Edge Functions（wb-auth / aliyun-proxy）
#   deploy-fc  - 部署阿里云 FC 定时退订执行器
#   cleanup    - 清理本分支上的一次性探针 workflow 文件
#   diag-rls   - RLS / grants / 行数 只读诊断（不改任何东西）
#   rls-tighten- 收紧 user_data / app_users 的 anon 权限（破坏性，需人工确认后 dispatch）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'handoff / deploy-edge / deploy-fc / cleanup / diag-rls / rls-tighten-app / rls-tighten / recover-biz-map'
        required: true
        default: 'deploy-edge'
        type: choice
        options:
          - deploy-edge
          - deploy-fc
          - handoff
          - cleanup
          - diag-rls
          - rls-tighten-app
          - rls-tighten
          - recover-biz-map
permissions:
  contents: read
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WB_AUTH_SECRET: ${{ secrets.WB_AUTH_SECRET }}
      ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
      ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ============ 清理遗留的 probe_tmp secret key（id 而非 name）============
      - name: 清理遗留的 probe_tmp secret key
        if: inputs.mode == 'handoff' || inputs.mode == 'cleanup'
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          API=https://api.supabase.com/v1/projects/$REF
          curl -sS --max-time 40 "$API/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/keys.json
          KID=$(python3 -c "
          import json
          d = json.load(open('/tmp/keys.json'))
          items = d if isinstance(d, list) else d.get('api_keys', [])
          for k in items:
              if k.get('name') == 'probe_tmp':
                  print(k.get('id') or '')
                  break
          ")
          if [ -n "$KID" ]; then
            curl -sS -o /tmp/del.json -w '  DELETE http=%{http_code}\n' --max-time 40 \
              -X DELETE "$API/api-keys/$KID" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
            head -c 200 /tmp/del.json; echo
          else
            echo "  probe_tmp 不存在，跳过"
          fi
          rm -f /tmp/keys.json /tmp/del.json

      # ============ 密文交接强凭据 ============
      - name: 密文交接 service_role
        if: inputs.mode == 'handoff'
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          API=https://api.supabase.com/v1/projects/$REF
          curl -sS --max-time 40 "$API/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/keys.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/keys.json'))
          items = d if isinstance(d, list) else d.get('api_keys', [])
          found = {}
          for k in items:
              tag = '%s/%s' % (k.get('type'), k.get('name'))
              v = k.get('api_key')
              found[tag] = v
              print('  - %-26s len=%-4d prefix3=%s' % (tag, len(str(v or '')), str(v or '')[:3]))
          sr = found.get('legacy/service_role')
          sec = found.get('secret/default')
          assert sr, 'legacy/service_role not found'
          assert sec, 'secret/default not found'
          open('/tmp/sr.key', 'w').write(sr)
          open('/tmp/sec.key', 'w').write(sec)
          print('  提取完成（明文未落日志）')
          PY
          cat > /tmp/pub.pem <<'PUBEOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAk1xawhX4zqDZ9+6GKS/A
          9dMD0EwHdnKgcBf8Xc1YCTTPCErCqBHUgjaYGSuA85XazESvCh7EfO3XiUBm0mrw
          sSRVGtOOfWTzNwyWXyFDTi1JlJ6MZ0TVtuLPx0PnnZF5OiFAtdLnHLDi7r+teWDZ
          0MT0L6e9Wj2eEzaTnu/TgPuQT87TiQE5K0cZkwUBwdrVSkmbaBP076Z/fV8ivRMQ
          MqllkmMYIUS50DGMcXhJA8lN3IoiK0Z+dvGTpf6MGCx8PBScjjJnkul9tMXJ3qIz
          J3EXb92LNfjBjUvPs2VWzhpbbnhzkbqP5N28xQFO+nmrZ1LJrZVo19x/MQ6DVf5W
          m+Wp8f3snrHxGWJuytV05Fq+Y40rKrVLx/xDertYh2FipTO1/f9E3SMkvmoOMH/j
          2HbdPNn9PncMyH4XRwxd5kP7qx9nYLB6H4JsusMJBreUzjk6A5SsgkYnyEVBiDxx
          ojVp1FpuLvuArgEUeOlvnkBQb8ZctJIKNysCqXP1U5OWPGs1e5F243cRKrzNK2Nx
          nZIW++UqHrsCf5pKTpX1JeK2YWPnZb0FkNsx6U4as5jyGScEQUKsaOLzdMP8asii
          AXgTLPHt7P+8WNWjzsxw1fWB9ZYas7jaIAB7ZRHsklwO5gVm1Jpx6TNo56hnd365
          kO56d3pdQ4OWbhxFJXzoQVECAwEAAQ==
          -----END PUBLIC KEY-----
          PUBEOF
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/sr.key -out /tmp/sr.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/sec.key -out /tmp/sec.enc
          echo "  SR_ENC_B64=$(base64 -w0 /tmp/sr.enc)"
          echo "  SEC_ENC_B64=$(base64 -w0 /tmp/sec.enc)"
          rm -f /tmp/sr.key /tmp/sec.key /tmp/sr.enc /tmp/sec.enc /tmp/keys.json /tmp/pub.pem

      # ============ 部署 Edge Functions ============
      - name: 下发 WB_AUTH_SECRET 到 Edge Function
        if: inputs.mode == 'deploy-edge'
        run: |
          set -eu
          printf 'WB_AUTH_SECRET=%s\n' "$WB_AUTH_SECRET" > /tmp/.env.wb
          # 新版 CLI 非交互环境必须显式 --yes，否则报 "Confirmation required" 直接失败
          supabase secrets set --env-file /tmp/.env.wb --project-ref opauwtkivhjxlijfqaix --yes
          rm -f /tmp/.env.wb

      - name: 部署 wb-auth（--no-verify-jwt）
        if: inputs.mode == 'deploy-edge'
        run: |
          supabase functions deploy wb-auth --project-ref opauwtkivhjxlijfqaix --no-verify-jwt --yes

      - name: 部署 aliyun-proxy（源码在 ref 上才部署）
        if: inputs.mode == 'deploy-edge'
        run: |
          if [ -d supabase/functions/aliyun-proxy ]; then
            supabase functions deploy aliyun-proxy --project-ref opauwtkivhjxlijfqaix --yes
          else
            echo "  aliyun-proxy 源码不在本 ref，跳过"
          fi

      - name: 冒烟验证（只测必须被拒绝的路径）
        if: inputs.mode == 'deploy-edge'
        run: |
          set -eu
          URL=https://opauwtkivhjxlijfqaix.supabase.co/functions/v1/wb-auth
          echo "  1) 未知 action:"
          curl -sS -o /tmp/r1 -w '    http=%{http_code}\n' --max-time 30 -X POST "$URL" \
            -H 'content-type: application/json' -d '{"action":"nope"}'
          head -c 160 /tmp/r1; echo
          echo "  2) 空密码登录:"
          curl -sS -o /tmp/r2 -w '    http=%{http_code}\n' --max-time 30 -X POST "$URL" \
            -H 'content-type: application/json' -d '{"action":"login","username":"zhangruiyao","password":""}'
          head -c 160 /tmp/r2; echo
          echo "  3) 无票据读 user_data:"
          curl -sS -o /tmp/r3 -w '    http=%{http_code}\n' --max-time 30 -X POST "$URL" \
            -H 'content-type: application/json' -d '{"action":"get_user_data","username":"zhangruiyao"}'
          head -c 160 /tmp/r3; echo
          echo "  4) 伪造票据:"
          curl -sS -o /tmp/r4 -w '    http=%{http_code}\n' --max-time 30 -X POST "$URL" \
            -H 'content-type: application/json' \
            -d '{"action":"get_user_data","username":"zhangruiyao","ticket":"eyJmYWtlIjoxfQ.forged"}'
          head -c 160 /tmp/r4; echo
          rm -f /tmp/r1 /tmp/r2 /tmp/r3 /tmp/r4

      # ============ 部署 FC ============
      - name: 部署阿里云 FC 定时退订执行器
        if: inputs.mode == 'deploy-fc'
        run: |
          set -eu
          pip install --quiet aliyun-fc2==2.5.2
          python3 ops/deploy_fc_refund.py --mode deploy

      # ============ 清理探针文件 ============
      - name: 清理一次性探针 workflow
        if: inputs.mode == 'cleanup'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/probe-a.yml .github/workflows/probe-b.yml \
                .github/workflows/probe-c.yml .github/workflows/probe-d.yml \
                .github/workflows/oneoff-deploy-wb-auth.yml \
                .github/workflows/oneoff-diag-rls.yml .github/workflows/oneoff-probe-keys.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "无探针文件可清理"
          else
            git commit -m "chore: 清理一次性探针 workflow [skip ci]"
            git push
          fi

      # ============ RLS 只读诊断 ============
      - name: RLS 只读诊断（不改数据）
        if: inputs.mode == 'diag-rls'
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          run_sql() {
            curl -sS --fail-with-body --max-time 40 -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1")"
            echo
          }
          echo '===== 1. 表 RLS 开关 ====='
          run_sql "SELECT c.relname AS table, c.relrowsecurity AS rls_on, c.relforcerowsecurity AS rls_forced FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' ORDER BY c.relname;"
          echo '===== 2. RLS policies ====='
          run_sql "SELECT tablename, policyname, permissive, roles::text, cmd, coalesce(qual,'') AS using_expr, coalesce(with_check,'') AS check_expr FROM pg_policies WHERE schemaname='public' ORDER BY tablename, policyname;"
          echo '===== 3. 表级 grants ====='
          run_sql "SELECT table_name, grantee, privilege_type FROM information_schema.table_privileges WHERE table_schema='public' AND table_name IN ('user_data','app_users') ORDER BY table_name, grantee, privilege_type;"
          echo '===== 4. 列级 grants（只 user_data）====='
          run_sql "SELECT table_name, grantee, privilege_type, column_name FROM information_schema.column_privileges WHERE table_schema='public' AND table_name='user_data' ORDER BY grantee, column_name, privilege_type;"
          echo '===== 5. 表结构 ====='
          run_sql "SELECT table_name, column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema='public' AND table_name IN ('user_data','app_users') ORDER BY table_name, ordinal_position;"
          echo '===== 6. user_data 行清单（只看 username/键名，不取值）====='
          run_sql "SELECT u.username, ARRAY(SELECT jsonb_object_keys(COALESCE(u.data,'{}'::jsonb))) AS data_keys FROM public.user_data u ORDER BY u.username;"
          echo '===== 7. app_users 行数（不取口令）====='
          run_sql "SELECT count(*) AS app_users_rows FROM public.app_users;"
          echo '===== 8. 角色属性（谁 BYPASSRLS）====='
          run_sql "SELECT rolname, rolsuper, rolbypassrls, rolcanlogin FROM pg_roles WHERE rolname IN ('anon','authenticated','service_role','postgres','authenticator') ORDER BY rolname;"
          echo '===== 9. service_role 的表权限（确认 revoke 不会误伤）====='
          run_sql "SELECT table_name, grantee, privilege_type FROM information_schema.table_privileges WHERE table_schema='public' AND table_name IN ('user_data','app_users') AND grantee IN ('service_role','postgres') ORDER BY table_name, grantee, privilege_type;"
          echo '===== 10. ocd_biz_map 行是否存在 ====='
          run_sql "SELECT username, (data ? 'map') AS has_map, jsonb_typeof(data->'map') AS map_type FROM public.user_data WHERE username='ocd_biz_map';"
          echo '===== 11. 当前 anon 实测可读行数 ====='
          ANON=sb_publishable_SM9yvpcOBqvVPH2oGwTmFg_BZ1Lz9Xd
          curl -sS --max-time 30 -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "https://opauwtkivhjxlijfqaix.supabase.co/rest/v1/user_data?select=username" -w '\n    http=%{http_code}\n' || true
          echo '===== 12. 当前 anon 实测可读 app_users 行数 ====='
          curl -sS --max-time 30 -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "https://opauwtkivhjxlijfqaix.supabase.co/rest/v1/app_users?select=username" -w '\n    http=%{http_code}\n' || true
          echo '===== 13. 关键：anon 能否读到 app_users.password 列（只打印长度，不打印值）====='
          curl -sS --max-time 30 -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "https://opauwtkivhjxlijfqaix.supabase.co/rest/v1/app_users?select=username,role,length(password)" -w '\n    http=%{http_code}\n' || true
          echo '===== 14. 关键：anon 能否读到 user_data.data 里的 ak_secret（只打印长度）====='
          curl -sS --max-time 30 -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "https://opauwtkivhjxlijfqaix.supabase.co/rest/v1/user_data?username=eq.zhangruiyao&select=username,length(data->>'ak_secret')" -w '\n    http=%{http_code}\n' || true
          echo '===== 15. user_data / app_users 的约束与索引（username 是否唯一）====='
          run_sql "SELECT c.relname AS table, con.conname, con.contype, pg_get_constraintdef(con.oid) AS def FROM pg_constraint con JOIN pg_class c ON c.oid=con.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('user_data','app_users') ORDER BY c.relname, con.contype;"
          run_sql "SELECT tablename, indexname, indexdef FROM pg_indexes WHERE schemaname='public' AND tablename IN ('user_data','app_users') ORDER BY tablename, indexname;"
          echo '===== 16. ocd_biz_map 行数（必须 = 1，否则单行策略不可靠）====='
          run_sql "SELECT count(*) AS ocd_rows FROM public.user_data WHERE username='ocd_biz_map';"
          echo '===== 17. 各表总行数 ====='
          run_sql "SELECT 'user_data' AS t, count(*) FROM public.user_data UNION ALL SELECT 'app_users', count(*) FROM public.app_users;"

      # ============ RLS 收紧 A：只动 app_users（零依赖，可立即执行）============
      # app_users.password 是明文列。当前 policy app_users_anon_select USING true +
      #   表级 SELECT grant ⇒ 任何拿到 publishable key 的人都能 select=* 拖走
      #   全部账号明文口令。新版 cloud-store.js 走 wb-auth 网关（service_role），
      #   前端/工具页都不再直连 app_users ⇒ 收紧对现网零影响。
      - name: 收紧 app_users 权限（阶段 A，零影响）
        if: inputs.mode == 'rls-tighten-app'
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          run_sql() {
            curl -sS --fail-with-body --max-time 40 -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1")"
            echo
          }
          echo '--- A0) 收紧前快照（口令只打长度）---'
          run_sql "SELECT username, role, length(password) AS pw_len FROM public.app_users ORDER BY username;"
          echo '--- A1) 撤销 anon / authenticated 对 app_users 的表级权限 ---'
          run_sql "REVOKE ALL PRIVILEGES ON TABLE public.app_users FROM anon, authenticated;"
          echo '--- A2) 撤销列级权限（PostgreSQL 表级 REVOKE 不会连带撤销列级）---'
          run_sql "REVOKE ALL (id, username, password, role, created_by, created_at) ON TABLE public.app_users FROM anon, authenticated;"
          echo '--- A3) 删除 app_users 上的 anon policy ---'
          run_sql "DROP POLICY IF EXISTS app_users_anon_insert ON public.app_users;"
          run_sql "DROP POLICY IF EXISTS app_users_anon_select ON public.app_users;"
          run_sql "DROP POLICY IF EXISTS app_users_anon_update ON public.app_users;"
          echo '--- A4) 撤销 future table 的默认授权（止血，防新建表再漏）---'
          run_sql "ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated;"
          run_sql "ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON SEQUENCES FROM anon, authenticated;"
          echo '--- A5) 清理我之前实验遗留的诊断垃圾行 ---'
          run_sql "DELETE FROM public.user_data WHERE username='_diag_test_write';"
          echo '--- A6) 结果复核：policies ---'
          run_sql "SELECT tablename, policyname, roles::text, cmd, coalesce(qual,'') AS using_expr, coalesce(with_check,'') AS check_expr FROM pg_policies WHERE schemaname='public' ORDER BY tablename, policyname;"
          echo '--- A7) 结果复核：grants ---'
          run_sql "SELECT table_name, grantee, privilege_type FROM information_schema.table_privileges WHERE table_schema='public' AND table_name IN ('user_data','app_users') ORDER BY table_name, grantee, privilege_type;"
          run_sql "SELECT table_name, grantee, privilege_type, column_name FROM information_schema.column_privileges WHERE table_schema='public' AND table_name='app_users' ORDER BY grantee, column_name, privilege_type;"
          echo '--- A8) anon 实测：app_users 应 403/0 行 ---'
          ANON=sb_publishable_SM9yvpcOBqvVPH2oGwTmFg_BZ1Lz9Xd
          curl -sS --max-time 30 -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "https://opauwtkivhjxlijfqaix.supabase.co/rest/v1/app_users?select=username" -w '\n    http=%{http_code}\n' || true
          echo '--- A9) service_role 实测：应仍可读 4 行 ---'
          curl -sS --max-time 30 -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "https://opauwtkivhjxlijfqaix.supabase.co/rest/v1/app_users?select=username,role" -w '\n    http=%{http_code}\n' || true
          echo '--- A10) user_data 行数复核（应为 5，_diag_test_write 已删）---'
          run_sql "SELECT username FROM public.user_data ORDER BY username;"
          echo '--- A11) 各账号退订开关现状（不取 AK/SK 值）---'
          run_sql "SELECT username, data->>'schedule_enabled' AS sched_on, data->>'schedule_hour' AS sh, data->>'schedule_minute' AS sm, data->>'ak_active' AS ak_on, (data ? 'schedule_exclude_instance_ids') AS has_exclude, (data ? 'schedule_ak_ids') AS has_ak_ids FROM public.user_data WHERE username NOT IN ('ocd_biz_map','_fc_heartbeat') ORDER BY username;"

      # ============ RLS 收紧 B：user_data 收到 ocd_biz_map 单行（需先发工具页新版）============
      - name: 收紧 user_data 权限（阶段 B，前置：工具页新版已上线）
        if: inputs.mode == 'rls-tighten'
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          run_sql() {
            curl -sS --fail-with-body --max-time 40 -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1")"
            echo
          }
          echo '--- 0) 删除已注销账号 chu 的 user_data 残留行（用户 2026-11-16 确认）---'
          run_sql "DELETE FROM public.user_data WHERE username='chu' AND username NOT IN (SELECT username FROM public.app_users);"
          echo '--- 0b) 删除后 user_data 行清单 ---'
          run_sql "SELECT username FROM public.user_data ORDER BY username;"
          echo '--- 1) 撤销 anon / authenticated 对 user_data 的一切权限 ---'
          run_sql "REVOKE ALL PRIVILEGES ON TABLE public.user_data FROM anon, authenticated;"
          echo '--- 2) 撤销列级权限（表级 REVOKE 不连带）---'
          run_sql "REVOKE ALL (username, data, updated_at) ON TABLE public.user_data FROM anon, authenticated;"
          echo '--- 3) 删除 anon_all_user_data 宽松 policy ---'
          run_sql "DROP POLICY IF EXISTS anon_all_user_data ON public.user_data;"
          echo '--- 4) 只给 anon 留 ocd_biz_map 一行的读写 ---'
          run_sql "GRANT SELECT, INSERT, UPDATE ON TABLE public.user_data TO anon;"
          run_sql "DROP POLICY IF EXISTS anon_ocd_biz_map ON public.user_data;"
          run_sql "CREATE POLICY anon_ocd_biz_map ON public.user_data FOR ALL TO anon USING (username = 'ocd_biz_map') WITH CHECK (username = 'ocd_biz_map');"
          echo '--- 5) 结果复核 ---'
          run_sql "SELECT tablename, policyname, roles::text, cmd, coalesce(qual,'') AS using_expr, coalesce(with_check,'') AS check_expr FROM pg_policies WHERE schemaname='public' ORDER BY tablename, policyname;"
