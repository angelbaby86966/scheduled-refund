name: oneoff-handoff
# 一次性凭据交接（RSA 密文通道）
#
# 背景：GITHUB_TOKEN 无权读写 repo Secrets（permissions 里根本没有 secrets 键），
#       而 service_role 明文又绝不能落到 public 仓库里。
# 方案：本地生成 RSA-4096 密钥对 → 公钥内嵌本 workflow（明文无害）→
#       workflow 用公钥加密凭据 → 只把密文打进日志 → 本地私钥解密 → 用本地 PAT 写 Secret。
#       全程没有任何明文离开加密边界。
#
# 本次同时清理上次探测遗留的 probe_tmp secret key（探测时删除步骤失败）。
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPA_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: 清理 probe_tmp + 密文交接强凭据
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          API=https://api.supabase.com/v1/projects/$REF

          echo "== 1. 删除探测期遗留的 probe_tmp secret key =="
          curl -sS -o /tmp/del.json -w '  DELETE probe_tmp HTTP=%{http_code}\n' --max-time 40 \
            -X DELETE "$API/api-keys/probe_tmp" -H "Authorization: Bearer $SUPA_TOKEN"
          head -c 200 /tmp/del.json; echo

          echo "== 2. 拉取 api-keys =="
          curl -sS --max-time 40 "$API/api-keys" -H "Authorization: Bearer $SUPA_TOKEN" > /tmp/keys.json

          echo "== 3. 提取强凭据（明文不打印）=="
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/keys.json'))
          items = d if isinstance(d, list) else d.get('api_keys', [])
          found = {}
          for k in items:
              tag = '%s/%s' % (k.get('type'), k.get('name'))
              v = k.get('api_key')
              found[tag] = v
              print('  - %-26s len=%-4d prefix3=%s' % (tag, len(str(v or '')), str(v or '')[:3]))
          sr = found.get('legacy/service_role')
          sec = found.get('secret/default')
          assert sr, 'legacy/service_role not found'
          assert sec, 'secret/default not found'
          open('/tmp/sr.key', 'w').write(sr)
          open('/tmp/sec.key', 'w').write(sec)
          print('  提取完成（明文未落日志）')
          PY

          echo "== 4. 用内嵌公钥加密 → 输出密文 =="
          cat > /tmp/pub.pem <<'PUBEOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAk1xawhX4zqDZ9+6GKS/A
          9dMD0EwHdnKgcBf8Xc1YCTTPCErCqBHUgjaYGSuA85XazESvCh7EfO3XiUBm0mrw
          sSRVGtOOfWTzNwyWXyFDTi1JlJ6MZ0TVtuLPx0PnnZF5OiFAtdLnHLDi7r+teWDZ
          0MT0L6e9Wj2eEzaTnu/TgPuQT87TiQE5K0cZkwUBwdrVSkmbaBP076Z/fV8ivRMQ
          MqllkmMYIUS50DGMcXhJA8lN3IoiK0Z+dvGTpf6MGCx8PBScjjJnkul9tMXJ3qIz
          J3EXb92LNfjBjUvPs2VWzhpbbnhzkbqP5N28xQFO+nmrZ1LJrZVo19x/MQ6DVf5W
          m+Wp8f3snrHxGWJuytV05Fq+Y40rKrVLx/xDertYh2FipTO1/f9E3SMkvmoOMH/j
          2HbdPNn9PncMyH4XRwxd5kP7qx9nYLB6H4JsusMJBreUzjk6A5SsgkYnyEVBiDxx
          ojVp1FpuLvuArgEUeOlvnkBQb8ZctJIKNysCqXP1U5OWPGs1e5F243cRKrzNK2Nx
          nZIW++UqHrsCf5pKTpX1JeK2YWPnZb0FkNsx6U4as5jyGScEQUKsaOLzdMP8asii
          AXgTLPHt7P+8WNWjzsxw1fWB9ZYas7jaIAB7ZRHsklwO5gVm1Jpx6TNo56hnd365
          kO56d3pdQ4OWbhxFJXzoQVECAwEAAQ==
          -----END PUBLIC KEY-----
          PUBEOF
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/sr.key -out /tmp/sr.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/sec.key -out /tmp/sec.enc
          echo "  SR_ENC_B64=$(base64 -w0 /tmp/sr.enc)"
          echo "  SEC_ENC_B64=$(base64 -w0 /tmp/sec.enc)"

          echo "== 5. 确认 probe_tmp 已消失 =="
          curl -sS --max-time 40 "$API/api-keys" -H "Authorization: Bearer $SUPA_TOKEN" > /tmp/keys2.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/keys2.json'))
          items = d if isinstance(d, list) else d.get('api_keys', [])
          names = ['%s/%s' % (k.get('type'), k.get('name')) for k in items]
          print('  剩余 key:', names)
          assert 'secret/probe_tmp' not in names, 'probe_tmp 仍存在！'
          print('  probe_tmp 已确认删除')
          PY

          rm -f /tmp/sr.key /tmp/sec.key /tmp/sr.enc /tmp/sec.enc /tmp/keys.json /tmp/keys2.json /tmp/del.json /tmp/pub.pem
          echo "== 完成 =="
