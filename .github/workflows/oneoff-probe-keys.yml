name: oneoff-probe-keys

on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/oneoff-probe-keys.yml]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPA_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Probe API keys + project settings (values never printed in full)
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          echo '===== A. api-keys 原始响应结构（只打印字段名/长度/前缀）====='
          curl -sS --max-time 40 "https://api.supabase.com/v1/projects/$REF/api-keys" \
            -H "Authorization: Bearer $SUPA_TOKEN" > /tmp/keys.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/keys.json'))
          items = d if isinstance(d, list) else d.get('api_keys', [])
          print("  顶层类型:", type(d).__name__, "| 条目数:", len(items))
          for k in items:
              v = k.get('api_key')
              print("  - name=%-12s type=%-11s fields=%s" % (
                  k.get('name'), k.get('type'), sorted(k.keys())))
              if v is None:
                  print("      api_key=None")
              else:
                  s = str(v)
                  print("      api_key len=%d prefix3=%r is_jwt=%s" % (len(s), s[:3], s.startswith('eyJ')))
          PY
          echo '===== B. 项目设置里是否含 jwt_secret ====='
          curl -sS --max-time 40 "https://api.supabase.com/v1/projects/$REF" \
            -H "Authorization: Bearer $SUPA_TOKEN" > /tmp/proj.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/proj.json'))
          keys = sorted(d.keys())
          print("  顶层字段:", keys)
          for k in keys:
              if 'jwt' in k.lower() or 'secret' in k.lower() or 'key' in k.lower():
                  v = d[k]
                  s = str(v)
                  print("  %s -> len=%d prefix3=%r is_jwt=%s" % (k, len(s), s[:3], s.startswith('eyJ')))
          PY
          echo '===== C. 是否能创建新的 secret key（POST api-keys）====='
          curl -sS -o /tmp/newkey.json -w '  HTTP=%{http_code}\n' --max-time 40 \
            -X POST "https://api.supabase.com/v1/projects/$REF/api-keys" \
            -H "Authorization: Bearer $SUPA_TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"probe_tmp","type":"secret"}'
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/newkey.json'))
          except Exception as e:
              print("  解析失败:", e, open('/tmp/newkey.json').read()[:200]); raise SystemExit
          if isinstance(d, dict) and d.get('api_key'):
              print("  创建成功: name=%s type=%s len=%d prefix3=%r" % (
                  d.get('name'), d.get('type'), len(str(d['api_key'])), str(d['api_key'])[:3]))
          else:
              print("  响应:", json.dumps(d, ensure_ascii=False)[:300])
          PY
          echo '===== D. CLI 能否用 access token 列出 keys（老 API）====='
          curl -sS -o /tmp/legacy.json -w '  HTTP=%{http_code}\n' --max-time 40 \
            "https://api.supabase.com/v1/projects/$REF/api-keys/legacy" \
            -H "Authorization: Bearer $SUPA_TOKEN"
          head -c 300 /tmp/legacy.json; echo
          echo '===== E. 清理临时 key ====='
          python3 - <<'PY'
          import json, urllib.request
          try:
              d = json.load(open('/tmp/newkey.json'))
              kid = d.get('id') or d.get('name')
          except Exception:
              kid = None
          print("  临时 key id:", kid)
          if kid:
              req = urllib.request.Request(
                  "https://api.supabase.com/v1/projects/opauwtkivhjxlijfqaix/api-keys/probe_tmp",
                  method="DELETE", headers={"Authorization": "Bearer " + open('/tmp/token.txt').read().strip()})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: print("  删除:", r.status)
              except Exception as e: print("  删除失败:", e)
          PY
