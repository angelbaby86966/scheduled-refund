name: oneoff-deploy-wb-auth
# 部署 wb-auth 服务端鉴权网关（Edge Function）
#   1) 清理遗留的 probe_tmp secret key（必须用 id，name 会报 Invalid UUID）
#   2) 下发 WB_AUTH_SECRET 到 Edge Function 环境变量（明文只进平台 secret 存储）
#   3) 部署 wb-auth，关闭 JWT 校验（身份凭证由本函数自签自验的 HMAC 票据）
#
# 冒烟测试只覆盖「必须被拒绝」的路径；正确密码的登录验证在本地做，
# 避免管理员口令出现在 public 仓库的任何文件里。
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      WB_AUTH_SECRET: ${{ secrets.WB_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 清理遗留的 probe_tmp secret key
        run: |
          set -eu
          REF=opauwtkivhjxlijfqaix
          API=https://api.supabase.com/v1/projects/$REF
          curl -sS --max-time 40 "$API/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/keys.json
          KID=$(python3 -c "
          import json
          d = json.load(open('/tmp/keys.json'))
          items = d if isinstance(d, list) else d.get('api_keys', [])
          for k in items:
              if k.get('name') == 'probe_tmp':
                  print(k.get('id') or '')
                  break
          ")
          if [ -n "$KID" ]; then
            curl -sS -o /tmp/del.json -w '  DELETE http=%{http_code}\n' --max-time 40 \
              -X DELETE "$API/api-keys/$KID" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
            head -c 200 /tmp/del.json; echo
          else
            echo "  probe_tmp 不存在，跳过"
          fi
          rm -f /tmp/keys.json /tmp/del.json

      - name: 下发 WB_AUTH_SECRET 到 Edge Function
        run: |
          set -eu
          printf 'WB_AUTH_SECRET=%s\n' "$WB_AUTH_SECRET" > /tmp/.env.wb
          supabase secrets set --env-file /tmp/.env.wb --project-ref opauwtkivhjxlijfqaix
          rm -f /tmp/.env.wb

      - name: 部署 wb-auth（--no-verify-jwt）
        run: |
          supabase functions deploy wb-auth --project-ref opauwtkivhjxlijfqaix --no-verify-jwt

      - name: 冒烟验证（只测必须被拒绝的路径）
        run: |
          set -eu
          URL=https://opauwtkivhjxlijfqaix.supabase.co/functions/v1/wb-auth
          echo "  1) 未知 action:"
          curl -sS -o /tmp/r1 -w '    http=%{http_code}\n' --max-time 30 -X POST "$URL" \
            -H 'content-type: application/json' -d '{"action":"nope"}'
          head -c 160 /tmp/r1; echo
          echo "  2) 空密码登录:"
          curl -sS -o /tmp/r2 -w '    http=%{http_code}\n' --max-time 30 -X POST "$URL" \
            -H 'content-type: application/json' -d '{"action":"login","username":"zhangruiyao","password":""}'
          head -c 160 /tmp/r2; echo
          echo "  3) 无票据读 user_data:"
          curl -sS -o /tmp/r3 -w '    http=%{http_code}\n' --max-time 30 -X POST "$URL" \
            -H 'content-type: application/json' -d '{"action":"get_user_data","username":"zhangruiyao"}'
          head -c 160 /tmp/r3; echo
          echo "  4) 伪造票据:"
          curl -sS -o /tmp/r4 -w '    http=%{http_code}\n' --max-time 30 -X POST "$URL" \
            -H 'content-type: application/json' \
            -d '{"action":"get_user_data","username":"zhangruiyao","ticket":"eyJmYWtlIjoxfQ.forged"}'
          head -c 160 /tmp/r4; echo
          rm -f /tmp/r1 /tmp/r2 /tmp/r3 /tmp/r4
