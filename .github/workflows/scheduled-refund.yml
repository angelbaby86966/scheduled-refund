name: scheduled-refund
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
# 串行化：cron 每 10 分钟、超时 40 分钟可能重叠，统一排队执行，
# 避免多个 run 同时改写 refund_state.json 触发非快进 push 冲突（状态文件更一致）。
concurrency:
  group: scheduled-refund
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refund:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scheduled refund
        run: python3 scheduled_refund.py
      - name: Commit refunded state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add refund_state.json
          if git diff --cached --quiet; then
            echo "refund_state.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新已退订状态 [skip ci]"
            git push
          fi
