name: 阿里云轻量云定时自动退订

on:
  # 每天北京时间 23:35 执行（UTC 15:35）
  schedule:
    - cron: '35 15 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  refund:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled refund
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          REGIONS: ${{ vars.REGIONS || 'cn-hangzhou,cn-beijing,cn-shanghai,cn-shenzhen,cn-chengdu,cn-guangzhou' }}
        run: npm run refund
