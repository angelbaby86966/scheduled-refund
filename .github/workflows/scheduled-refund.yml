name: scheduled-refund
on:
  schedule:
    - cron: '25-59/10 15 * * *'
  workflow_dispatch: {}
# 串行化：cron 每 10 分钟、超时 40 分钟可能重叠，统一排队执行，
# 避免多个 run 同时改写 refund_state.json 触发非快进 push 冲突（状态文件更一致）。
concurrency:
  group: scheduled-refund
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refund:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # ⚠️ 2026-11-16 安全加固：定时退订执行器改用**服务端强凭据**（service_role）。
      # 前端已改走 wb-auth 服务端网关、anon 对 user_data 的访问被收紧，
      # 执行器必须用 service_role（具 BYPASSRLS）才能继续读表。
      # 密钥存放在 repo Secret（GitHub Actions 日志自动掩码），不落在源码里。
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scheduled refund
        run: python3 scheduled_refund.py
      - name: Commit refunded state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 仅当脚本确实写出了状态文件时才提交（绝大多数轮次无退订 → 文件不存在 → 正常跳过，
          # 之前用 git add 直接报 pathspec fatal，导致整轮被标记 failure）
          if [ ! -f refund_state.json ]; then
            echo "refund_state.json 不存在（本次无退订发生），跳过提交"
            exit 0
          fi
          git add refund_state.json
          if git diff --cached --quiet; then
            echo "refund_state.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新已退订状态 [skip ci]"
            git push
          fi
