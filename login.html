<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿里云工作台 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 420px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .login-card h1 {
    font-size: 24px;
    color: #1a1a2e;
    margin-bottom: 8px;
    text-align: center;
  }
  .login-card .subtitle {
    font-size: 14px;
    color: #999;
    text-align: center;
    margin-bottom: 36px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .form-group input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
  }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .btn-login:hover { opacity: 0.92; }
  .btn-login:active { transform: scale(0.98); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg-box {
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 24px;
    padding: 8px;
    border-radius: 6px;
    display: none;
  }
  .msg-box.show { display: block; }
  .msg-box.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
  .msg-box.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
  .msg-box.info { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
  .msg-box.warn { background: #fffbe6; color: #faad14; border: 1px solid #ffe58f; }
  .diag-section {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px dashed #e0e0e0;
    font-size: 12px;
    color: #999;
  }
  .diag-section summary { cursor: pointer; margin-bottom: 8px; color: #666; }
  .diag-item { margin-bottom: 4px; }
  .diag-item.ok { color: #52c41a; }
  .diag-item.fail { color: #ff4d4f; }
  .diag-item.warn { color: #faad14; }
  .import-box {
    margin-top: 8px;
    padding: 8px;
    background: #f5f5f5;
    border-radius: 4px;
  }
  .import-box textarea {
    width: 100%;
    font-size: 11px;
    font-family: monospace;
    padding: 6px;
    border: 1px solid #ddd;
    border-radius: 4px;
    resize: vertical;
    min-height: 60px;
  }
  .import-box button {
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    border: 1px solid #667eea;
    border-radius: 4px;
    background: #667eea;
    color: #fff;
    margin-top: 4px;
  }
  .import-box button:hover { opacity: 0.9; }
  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #bbb;
  }
  .cloud-badge {
    text-align: center;
    margin-bottom: 16px;
    font-size: 12px;
    color: #52c41a;
    font-weight: 500;
  }
</style>
<script src="https://beacon.cdn.qq.com/sdk/4.5.9/beacon_web.min.js"></script>
<script>
(function(){
  try{
    var beacon=new BeaconAction({
      appkey:'0WEB06U85YBSLJNL',
      versionCode:'1.0.0',
      channelID:'share',
      delay:1000,
      sessionDuration:30*60*1000,
      isOversea:false,
      needReportRqdEvent:false
    });
    beacon.onDirectUserAction('preview_page_view',{
      'url':location.href,
      'referrer':document.referrer,
      'title':document.title,
      'sandbox_id':'8f89eb5801b140d0a389cec0ac8bdd12'
    });
  }catch(e){}
})();
</script></head>
<body>
<div class="login-card">
  <h1>🔐 阿里云工作台</h1>
  <p class="subtitle">轻量云主机批量管理</p>
  <div class="cloud-badge">☁️ 云端账号系统 · 任意设备可登录</div>
  <form id="loginForm">
    <div class="form-group">
      <label for="username">账号</label>
      <input type="text" id="username" placeholder="请输入账号" autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="loginBtn">登 录</button>
    <div class="msg-box" id="msgBox"></div>
  </form>

  <!-- 诊断面板 -->
  <details class="diag-section" id="diagSection">
    <summary>🔧 无法登录？展开诊断信息</summary>
    <div id="diagContent">检测中...</div>
    <div style="margin-top:8px">
      <button onclick="runDiag()" style="font-size:11px;padding:4px 8px;cursor:pointer;border:1px solid #ddd;border-radius:4px;background:#fff;">重新诊断</button>
    </div>
    <div class="import-box" id="importBox" style="display:none">
      <div style="font-weight:600;color:#666;margin-bottom:4px">📥 批量导入用户（写入云端）</div>
      <div style="color:#888;margin-bottom:4px">管理员可在此处粘贴用户数据库 JSON，用户将被写入云端数据库</div>
      <textarea id="importJson" placeholder='{"users":{"zhaozong":{"password":"xxx","createdBy":"zhangruiyao","createdAt":123}}}'></textarea>
      <button onclick="importUserDB()">导入到云端</button>
      <div id="importResult" style="margin-top:4px;font-size:11px"></div>
    </div>
  </details>

  <p class="footer-note">仅供内部管理使用</p>
</div>

<script src="cloud-store.js?v=2"></script>
<script>
(function() {
  'use strict';

  // ====== 用户管理系统（云端版） ======
  var ADMIN_USER = 'zhangruiyao';
  var ADMIN_PASS = '86966azr';
  var LOGIN_KEY = 'wb_logged_in_v2';

  // ====== UI ======
  var form = document.getElementById('loginForm');
  var msgBox = document.getElementById('msgBox');
  var loginBtn = document.getElementById('loginBtn');

  function showMsg(msg, type) {
    msgBox.textContent = msg;
    msgBox.className = 'msg-box show ' + (type || 'error');
  }

  function hideMsg() {
    msgBox.className = 'msg-box';
  }

  // ====== 存储操作 ======
  function saveLogin(username, role) {
    var data = JSON.stringify({ user: username, role: role, time: Date.now() });
    try { sessionStorage.setItem(LOGIN_KEY, data); } catch(e) {}
    try { localStorage.setItem(LOGIN_KEY, data); } catch(e) {}
    try { localStorage.setItem('wb_current_user', username); } catch(e) {}
  }

  function isLoggedIn() {
    try {
      if (sessionStorage.getItem(LOGIN_KEY)) return true;
      if (localStorage.getItem(LOGIN_KEY)) {
        try { sessionStorage.setItem(LOGIN_KEY, localStorage.getItem(LOGIN_KEY)); } catch(e) {}
        return true;
      }
    } catch(e) {}
    return false;
  }

  // ====== 诊断 ======
  function runDiag() {
    var items = [];
    try {
      sessionStorage.setItem('_diag_test', '1');
      var sv = sessionStorage.getItem('_diag_test');
      sessionStorage.removeItem('_diag_test');
      items.push({ ok: sv === '1', text: 'sessionStorage: ' + (sv === '1' ? '正常 ✅' : '异常 ❌') });
    } catch(e) {
      items.push({ ok: false, text: 'sessionStorage: 不可用 ❌ (' + e.message + ')' });
    }
    try {
      localStorage.setItem('_diag_test', '1');
      var lv = localStorage.getItem('_diag_test');
      localStorage.removeItem('_diag_test');
      items.push({ ok: lv === '1', text: 'localStorage: ' + (lv === '1' ? '正常 ✅' : '异常 ❌') });
    } catch(e) {
      items.push({ ok: false, text: 'localStorage: 不可用 ❌ (' + e.message + ')' });
    }

    items.push({ ok: true, text: '页面地址: ' + window.location.href });

    var container = document.getElementById('diagContent');
    container.innerHTML = items.map(function(it) {
      var cls = it.ok ? 'ok' : 'fail';
      return '<div class="diag-item ' + cls + '">' + it.text + '</div>';
    }).join('');

    if (isLoggedIn()) {
      container.innerHTML += '<div class="diag-item ok" style="margin-top:8px;">检测到已登录状态，<a href="index.html" style="color:#1890ff;">点此直接进入</a></div>';
    }

    // 异步检查云端连接
    container.innerHTML += '<div class="diag-item" id="cloudDiag">☁️ 云端连接: 检测中...</div>';

    if (window.CloudStore) {
      CloudStore.getAllUsers().then(function(db) {
        var userCount = Object.keys(db.users || {}).length;
        var el = document.getElementById('cloudDiag');
        if (el) {
          el.className = 'diag-item ok';
          el.textContent = '☁️ 云端连接: 正常 ✅ | 管理员(1) + 普通用户(' + userCount + ')';
        }
        // 显示导入框
        var importBox = document.getElementById('importBox');
        if (importBox) importBox.style.display = 'block';
      }).catch(function(err) {
        var el = document.getElementById('cloudDiag');
        if (el) {
          el.className = 'diag-item fail';
          el.textContent = '☁️ 云端连接: 失败 ❌ (' + err.message + ')';
        }
      });
    }
  }

  // ====== 初始化 ======
  if (isLoggedIn()) {
    showMsg('已检测到登录状态，正在跳转...', 'success');
    setTimeout(function() { window.location.replace('index.html'); }, 500);
  }
  runDiag();

  // ====== 表单提交（云端验证） ======
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    hideMsg();

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();

    if (!username || !password) {
      showMsg('请输入账号和密码', 'error');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = '验证中...';

    // 从云端验证用户
    CloudStore.verifyUser(username, password).then(function(role) {
      if (role) {
        saveLogin(username, role);
        // 预加载用户数据（凭证、AI 设置等）到本地缓存
        return CloudStore.preload(username).then(function() {
          var roleLabel = role === 'admin' ? '管理员' : '普通用户';
          showMsg('✅ 登录成功！(' + roleLabel + ') 正在跳转...', 'success');
          loginBtn.textContent = '✅ 登录成功';
          setTimeout(function() { window.location.replace('index.html'); }, 500);
        });
      } else {
        showMsg('❌ 账号或密码错误，请重试', 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }).catch(function(err) {
      showMsg('❌ 云端验证失败: ' + err.message + '\n请检查网络后重试', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
    });
  });

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { form.dispatchEvent(new Event('submit')); }
  });

  // ====== 导入用户数据库到云端 ======
  function importUserDB() {
    var jsonStr = document.getElementById('importJson').value.trim();
    var resultEl = document.getElementById('importResult');
    if (!jsonStr) {
      resultEl.innerHTML = '<span style="color:#ff4d4f">请输入 JSON 数据</span>';
      return;
    }
    try {
      var data = JSON.parse(jsonStr);
      if (!data.users || typeof data.users !== 'object') {
        resultEl.innerHTML = '<span style="color:#ff4d4f">JSON 格式错误：缺少 users 对象</span>';
        return;
      }
      var keys = Object.keys(data.users);
      var count = 0;
      var errors = [];

      // 逐个写入云端
      var promises = keys.map(function(k) {
        if (k !== ADMIN_USER && data.users[k] && data.users[k].password) {
          return CloudStore.addUser(k, data.users[k].password, data.users[k].createdBy || ADMIN_USER)
            .then(function() { count++; })
            .catch(function(err) {
              // 用户可能已存在，尝试 update
              errors.push(k + ': ' + err.message);
            });
        }
        return Promise.resolve();
      });

      Promise.all(promises).then(function() {
        var msg = '<span style="color:#52c41a">✅ 成功导入 ' + count + ' 个用户到云端！</span>';
        if (errors.length > 0) {
          msg += '<br><span style="color:#faad14">部分失败: ' + errors.join('; ') + '</span>';
        }
        resultEl.innerHTML = msg;
        runDiag();
      });
    } catch(e) {
      resultEl.innerHTML = '<span style="color:#ff4d4f">❌ JSON 解析失败: ' + e.message + '</span>';
    }
  }

  window.importUserDB = importUserDB;
  window.runDiag = runDiag;
})();
</script>
</body>
</html>
